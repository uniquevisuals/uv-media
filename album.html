<!DOCTYPE html>
<html lang='en'><head><meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'/>
<title>UV Studio E-Album</title>
<style>
body{margin:0;background:#160a2a;font-family:sans-serif;padding:26px 14px 40px}
h1{color:#fff;text-align:center;font-size:22px;margin:4px 0 2px}
p.sub{color:#c4b5fd;text-align:center;margin:0 0 22px;font-size:14px}
.ea-lock{max-width:360px;margin:40px auto;background:#241243;border:1px solid #4c2a85;border-radius:16px;padding:28px 22px;text-align:center}
.ea-lock h2{color:#fff;margin:0 0 6px;font-size:20px}
.ea-lock p{color:#c4b5fd;font-size:14px;margin:0 0 16px}
.ea-lock input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #4c2a85;background:#160a2a;color:#fff;font-size:16px;text-align:center}
.ea-lock button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#ff8a2a);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.ea-lock .err{color:#ff9c9c;font-size:13px;margin-top:10px;min-height:16px}
.ea-msg{max-width:420px;margin:60px auto;text-align:center;color:#e9d5ff;font-size:16px;line-height:1.6}

.ea-teaser{max-width:520px;margin:0 auto;cursor:pointer}
.ea-teaser img{width:100%;display:block;border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.ea-open-line{text-align:center;color:#e9d5ff;font-size:15px;margin-top:12px;opacity:.85}
.ea-viewer{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;height:100dvh;background:#000;display:none;z-index:99999}
.ea-viewer.open{display:block}
.ea-stage{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:2200px;overflow:hidden;touch-action:none;background:#000}
.ea-zoom{display:flex;align-items:center;justify-content:center;width:100%;height:100%;will-change:transform}
.ea-zoom.anim{transition:transform .25s ease}
.ea-book{position:relative;width:min(100%,300vh);aspect-ratio:3/1;max-height:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ea-half{position:absolute;top:0;width:50%;height:100%;background-repeat:no-repeat}
.ea-half.l{left:0}
.ea-half.r{left:50%}
.ea-book.covermode{width:min(50%,150vh);aspect-ratio:3/2}
.ea-book.covermode .ea-half{width:100%;left:0}
.ea-spine{position:absolute;left:50%;top:0;width:30px;height:100%;transform:translateX(-15px);background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.38),rgba(0,0,0,0));pointer-events:none;z-index:2}
.ea-book.nospine .ea-spine{display:none}
.ea-tshade{position:absolute;top:0;width:50%;height:100%;pointer-events:none;opacity:0;z-index:2}
.ea-tshade.r{left:50%;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,0) 65%)}
.ea-tshade.l{left:0;background:linear-gradient(270deg,rgba(0,0,0,.85),rgba(0,0,0,0) 65%)}
.ea-flipper{position:absolute;top:0;width:50%;height:100%;display:none;z-index:3;pointer-events:none}
.ea-flipper.show{display:block}
.ea-flipper.next{left:50%}
.ea-flipper.prev{left:0}
.ea-segA{position:absolute;top:0;height:100%;width:40%;transform-style:preserve-3d}
.ea-flipper.next .ea-segA{left:0;transform-origin:left center}
.ea-flipper.prev .ea-segA{right:0;transform-origin:right center}
.ea-segB{position:absolute;top:0;height:100%;width:75%;transform-style:preserve-3d}
.ea-flipper.next .ea-segB{left:100%;transform-origin:left center}
.ea-flipper.prev .ea-segB{right:100%;transform-origin:right center}
.ea-segC{position:absolute;top:0;height:100%;width:100%;transform-style:preserve-3d}
.ea-flipper.next .ea-segC{left:100%;transform-origin:left center}
.ea-flipper.prev .ea-segC{right:100%;transform-origin:right center}
.ea-sface{position:absolute;top:0;left:0;width:100%;height:100%;background-repeat:no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ea-sface.back{transform:rotateY(180deg)}
.ea-cflip{position:absolute;top:0;width:50%;height:100%;display:none;z-index:3;pointer-events:none;transform-style:preserve-3d}
.ea-cflip.show{display:block}
.ea-cflip.next{left:50%;transform-origin:left center}
.ea-cflip.prev{left:0;transform-origin:right center}
.ea-cface{position:absolute;top:0;left:0;width:100%;height:100%;background-repeat:no-repeat;background-size:contain;background-position:center;background-color:#160a2a;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ea-cface.back{transform:rotateY(180deg);background-image:none;background-color:#241243}
.ea-close{position:absolute;top:12px;right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:42px;text-align:center;cursor:pointer}
.ea-count{position:absolute;bottom:14px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.55);font-size:13px;pointer-events:none;z-index:4}
.ea-hint{position:absolute;top:16px;left:0;width:100%;text-align:center;color:#fff;font-size:15px;background:rgba(0,0,0,.45);padding:8px 0;pointer-events:none;z-index:4;animation:eaHintFade 3.2s forwards}
@keyframes eaHintFade{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}

</style></head><body>
<h1>UV Studio E-Album</h1>
<p class='sub' id='eaAlbumTitle'>Loading…</p>
<div class='ea-lock' id='eaLock' style='display:none'>
  <h2>🔒 Private Album</h2>
  <p>Indha album password protected. Unga password podunga.</p>
  <input id='eaPw' type='password' placeholder='Password' autocomplete='off'/>
  <button onclick='eaUnlock()' type='button'>Open Album</button>
  <div class='err' id='eaPwErr'></div>
</div>

</div>
<div class='ea-viewer' id='eaViewer'>
  <div class='ea-stage' id='eaStage'>
    <div class='ea-zoom' id='eaZoom'>
      <div class='ea-book'>
        <div class='ea-half l' id='eaHalfL'></div>
        <div class='ea-half r' id='eaHalfR'></div>
        <div class='ea-tshade r' id='eaTshade'></div>
        <div class='ea-spine'></div>
        <div class='ea-flipper' id='eaFlipper'>
          <div class='ea-segA' id='eaSegA'>
            <div class='ea-sface front' id='eaAF'></div>
            <div class='ea-sface back' id='eaAB'></div>
            <div class='ea-segB' id='eaSegB'>
              <div class='ea-sface front' id='eaBF'></div>
              <div class='ea-sface back' id='eaBB'></div>
              <div class='ea-segC' id='eaSegC'>
                <div class='ea-sface front' id='eaCF'></div>
                <div class='ea-sface back' id='eaCB'></div>
              </div>
            </div>
          </div>
        </div>
        <div class='ea-cflip' id='eaCflip'>
          <div class='ea-cface front' id='eaCFf'></div>
          <div class='ea-cface back' id='eaCFb'></div>
        </div>
      </div>
    </div>
  </div>
  <button class='ea-close' onclick='closeAlbum()' type='button'>&#215;</button>
  <div class='ea-count' id='eaCount'></div>
  <div class='ea-hint' id='eaHint' style='display:none'>Pinch &#8594; zoom &#183; Swipe &#8594; adutha page</div>
</div>

</div>
<script>
var ALBUM=null;
function eaMsg(t){var d=document.getElementById('eaMsg');d.textContent=t;d.style.display='block';document.getElementById('eaAlbumTitle').textContent='UV Studio E-Album';}
function sha256hex(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}
var eaId=(new URLSearchParams(location.search).get('a')||'').replace(/[^a-z0-9\-]/gi,'');
if(!eaId){ eaMsg('Album link sariya illa. Unga link-a check pannunga.'); }
else{
  var sc=document.createElement('script');
  sc.src='albums/'+eaId+'.js';
  sc.onload=function(){
    if(!window.ALBUM){ eaMsg('Album kandupudika mudiyala.'); return; }
    ALBUM=window.ALBUM;
    document.getElementById('eaAlbumTitle').textContent=ALBUM.title||'E-Album';
    document.getElementById('eaTeaserImg').src=ALBUM.front;
    if(ALBUM.passwordHash && sessionStorage.getItem('ea-unlock-'+eaId)!=='1'){
      document.getElementById('eaLock').style.display='block';
    }else{
      document.getElementById('eaMain').style.display='block';
    }
  };
  sc.onerror=function(){ eaMsg('Album kandupudika mudiyala. Link-a check pannunga.'); };
  document.head.appendChild(sc);
}
function eaUnlock(){
  var pw=document.getElementById('eaPw').value;
  sha256hex(pw).then(function(h){
    if(h===ALBUM.passwordHash){
      sessionStorage.setItem('ea-unlock-'+eaId,'1');
      document.getElementById('eaLock').style.display='none';
      document.getElementById('eaMain').style.display='block';
    }else{
      document.getElementById('eaPwErr').textContent='Password thappu. Marubadi try pannunga.';
    }
  });
}
document.addEventListener('keydown',function(e){ if(e.key==='Enter' && document.getElementById('eaLock').style.display==='block') eaUnlock(); });
</script>

var eaScale=1,eaPanX=0,eaPanY=0;
function eaApply(anim){
  var z=document.getElementById('eaZoom');
  z.classList.toggle('anim',!!anim);
  z.style.transform='translate('+eaPanX+'px,'+eaPanY+'px) scale('+eaScale+')';
}
function eaResetZoom(anim){eaScale=1;eaPanX=0;eaPanY=0;eaApply(anim);}
function eaClampPan(){
  var st=document.getElementById('eaStage');
  var mx=(eaScale-1)*st.clientWidth/2, my=(eaScale-1)*st.clientHeight/2;
  eaPanX=Math.max(-mx,Math.min(mx,eaPanX));
  eaPanY=Math.max(-my,Math.min(my,eaPanY));
}
function eaHalf(el,url,size,pos,color){
  el.style.backgroundImage=url?('url('+url+')'):'none';
  el.style.backgroundSize=size; el.style.backgroundPosition=pos;
  el.style.backgroundColor=color||'transparent';
}
function eaRender(i){
  var L=document.getElementById('eaHalfL'), R=document.getElementById('eaHalfR'), pg=EA_PAGES[i];
  if(pg[2]==='cover'&&i===0){ eaHalf(L,null,'auto','center'); eaHalf(R,pg[0],'contain','center'); }
  else if(pg[2]==='cover'){ eaHalf(L,pg[0],'contain','center'); eaHalf(R,null,'auto','center'); }
  else{ eaHalf(L,pg[0],'200% 100%','left center'); eaHalf(R,pg[0],'200% 100%','right center'); }
  var bk=document.querySelector('.ea-book');
  bk.classList.toggle('nospine', pg[2]==='cover');
  bk.classList.toggle('covermode', pg[2]==='cover');
}
function eaCount(){document.getElementById('eaCount').textContent=(eaIdx+1)+' / '+EA_PAGES.length+' · '+EA_PAGES[eaIdx][1];}
function eaPreload(i){[i-1,i+1].forEach(function(j){if(j>=0&&j<EA_PAGES.length){var p=new Image();p.src=EA_PAGES[j][0];}});}
function eaFace(el,url,frac,off,plain){
  if(plain){ el.style.backgroundImage='none'; el.style.backgroundColor='#241243'; return; }
  el.style.backgroundColor='transparent';
  el.style.backgroundImage='url('+url+')';
  el.style.backgroundSize=(100/frac)+'% 100%';
  el.style.backgroundPosition=(off/(1-frac)*100)+'% center';
}
function eaSound(){ try{eaSnd.currentTime=0;var pr=eaSnd.play();if(pr&&pr.catch)pr.catch(function(){});}catch(e){} }
function eaDone(target){
  eaIdx=target;eaRender(eaIdx);eaCount();eaPreload(eaIdx);eaBusy=false;
}
function eaTurnBendy(dir,plainBack){
  var target=eaIdx+(dir==='next'?1:-1);
  eaBusy=true;eaResetZoom(false);
  var flip=document.getElementById('eaFlipper'),segA=document.getElementById('eaSegA'),segB=document.getElementById('eaSegB'),segC=document.getElementById('eaSegC');
  var AF=document.getElementById('eaAF'),AB=document.getElementById('eaAB'),BF=document.getElementById('eaBF'),BB=document.getElementById('eaBB'),CF=document.getElementById('eaCF'),CB=document.getElementById('eaCB');
  var tsh=document.getElementById('eaTshade');
  var cur=EA_PAGES[eaIdx][0], nxt=EA_PAGES[target][0];
  flip.classList.remove('next','prev');
  if(dir==='next'){
    if(plainBack){ eaHalf(document.getElementById('eaHalfR'),null,'auto','center','#241243'); }
    else{ eaHalf(document.getElementById('eaHalfR'),nxt,'200% 100%','right center'); }
    flip.classList.add('next');
    eaFace(AF,cur,.20,.50); eaFace(AB,nxt,.20,0,plainBack);
    eaFace(BF,cur,.15,.70); eaFace(BB,nxt,.15,.20,plainBack);
    eaFace(CF,cur,.15,.85); eaFace(CB,nxt,.15,.35,plainBack);
    tsh.className='ea-tshade r';
  }else{
    eaHalf(document.getElementById('eaHalfL'),nxt,'200% 100%','left center');
    flip.classList.add('prev');
    eaFace(AF,cur,.20,.30); eaFace(AB,nxt,.20,.50);
    eaFace(BF,cur,.15,.15); eaFace(BB,nxt,.15,.70);
    eaFace(CF,cur,.15,0); eaFace(CB,nxt,.15,.85);
    tsh.className='ea-tshade l';
  }
  flip.classList.add('show'); eaSound();
  var sign=dir==='next'?-1:1, t0=null, DUR=700;
  function frame(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var th=e*180, rad=th*Math.PI/180, s=Math.sin(rad);
    segA.style.transform='rotateY('+(sign*th)+'deg)';
    segB.style.transform='rotateY('+(-sign*s*48)+'deg)';
    segC.style.transform='rotateY('+(-sign*s*42)+'deg)';
    var sf=1-.30*s, sb=1-.22*s;
    AF.style.filter='brightness('+sf+')'; BF.style.filter='brightness('+sf+')'; CF.style.filter='brightness('+sf+')';
    AB.style.filter='brightness('+sb+')'; BB.style.filter='brightness('+sb+')'; CB.style.filter='brightness('+sb+')';
    tsh.style.opacity=(.5*s).toFixed(3);
    if(p<1){requestAnimationFrame(frame);}
    else{ flip.classList.remove('show'); segA.style.transform=''; segB.style.transform=''; segC.style.transform=''; tsh.style.opacity=0; eaDone(target); }
  }
  requestAnimationFrame(frame);
}
function eaTurnRigid(dir,frontImg){
  var target=eaIdx+(dir==='next'?1:-1);
  eaBusy=true;eaResetZoom(false);
  document.querySelector('.ea-book').classList.remove('covermode');
  var cf=document.getElementById('eaCflip'), ff=document.getElementById('eaCFf');
  var tsh=document.getElementById('eaTshade');
  cf.classList.remove('next','prev'); cf.classList.add(dir);
  ff.style.backgroundImage=frontImg?('url('+frontImg+')'):'none';
  if(dir==='next'){
    var tp=EA_PAGES[target];
    eaHalf(document.getElementById('eaHalfL'),null,'auto','center','#241243');
    eaHalf(document.getElementById('eaHalfR'),tp[0],'200% 100%','right center');
    tsh.className='ea-tshade r';
  }else if(target===0){
    eaHalf(document.getElementById('eaHalfR'),null,'auto','center');
    tsh.className='ea-tshade l';
  }else{
    var tp2=EA_PAGES[target];
    eaHalf(document.getElementById('eaHalfL'),tp2[0],'200% 100%','left center');
    eaHalf(document.getElementById('eaHalfR'),null,'auto','center','#241243');
    tsh.className='ea-tshade l';
  }
  cf.classList.add('show'); eaSound();
  var sign=dir==='next'?-1:1, t0=null, DUR=600;
  function frame(ts){
    if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var th=e*180, rad=th*Math.PI/180, s=Math.sin(rad);
    cf.style.transform='rotateY('+(sign*th)+'deg)';
    ff.style.filter='brightness('+(1-.28*s)+')';
    tsh.style.opacity=(.45*s).toFixed(3);
    if(p<1){requestAnimationFrame(frame);}
    else{ cf.classList.remove('show'); cf.style.transform=''; ff.style.filter=''; tsh.style.opacity=0; eaDone(target); }
  }
  requestAnimationFrame(frame);
}
function eaTurn(dir){
  var target=eaIdx+(dir==='next'?1:-1);
  if(eaBusy||target<0||target>=EA_PAGES.length)return;
  var curT=EA_PAGES[eaIdx][2], tgtT=EA_PAGES[target][2];
  if(curT==='cover'&&dir==='next'){ eaTurnRigid('next', EA_PAGES[eaIdx][0]); }
  else if(tgtT==='cover'&&dir==='prev'&&target===0){ eaTurnRigid('prev', null); }
  else if(curT==='cover'&&dir==='prev'){ eaTurnRigid('prev', EA_PAGES[eaIdx][0]); }
  else if(tgtT==='cover'&&dir==='next'){ eaTurnBendy('next', true); }
  else{ eaTurnBendy(dir, false); }
}
function openAlbum(){
  var v=document.getElementById('eaViewer');
  v.classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('eaHint').style.display='block';
  eaRender(eaIdx);eaResetZoom(false);eaCount();eaPreload(eaIdx);
  try{var de=document.documentElement;var r=(de.requestFullscreen?de.requestFullscreen():v.requestFullscreen?v.requestFullscreen():null);if(r&&r.catch)r.catch(function(){});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock){var p=screen.orientation.lock('landscape');if(p&&p.catch)p.catch(function(){});}}catch(e){}
}
function closeAlbum(){
  document.getElementById('eaViewer').classList.remove('open');
  document.body.style.overflow='';
  if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(function(){});}
}
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement){document.getElementById('eaViewer').classList.remove('open');document.body.style.overflow='';}
});
(function(){
  var v=document.getElementById('eaViewer'), st=document.getElementById('eaStage');
  var sx=0,sy=0,lx=0,ly=0,pinchD0=0,pinchS0=1,pinching=false,lastTap=0;
  function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
  st.addEventListener('touchstart',function(e){
    if(e.touches.length===2){pinching=true;pinchD0=dist(e.touches);pinchS0=eaScale;}
    else if(e.touches.length===1){sx=lx=e.touches[0].clientX;sy=ly=e.touches[0].clientY;}
  },{passive:true});
  st.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(pinching&&e.touches.length===2){
      eaScale=Math.max(1,Math.min(3.5,pinchS0*dist(e.touches)/Math.max(1,pinchD0)));
      if(eaScale===1){eaPanX=0;eaPanY=0;} eaClampPan(); eaApply(false);
    }else if(e.touches.length===1&&eaScale>1){
      var t=e.touches[0];
      eaPanX+=t.clientX-lx; eaPanY+=t.clientY-ly;
      lx=t.clientX; ly=t.clientY; eaClampPan(); eaApply(false);
    }
  },{passive:false});
  st.addEventListener('touchend',function(e){
    if(pinching){
      if(e.touches.length===0){pinching=false;if(eaScale<1.06)eaResetZoom(true);}
      return;
    }
    if(e.touches.length>0)return;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(eaScale>1)return;
    if(Math.abs(dx)<10&&Math.abs(dy)<10){
      var now=Date.now();
      if(now-lastTap<320){eaScale=2.2;eaPanX=0;eaPanY=0;eaClampPan();eaApply(true);lastTap=0;}
      else lastTap=now;
      return;
    }
    if(Math.abs(dx)>=42&&Math.abs(dx)>Math.abs(dy)*1.4){eaTurn(dx<0?'next':'prev');}
    else if(dy>=70&&Math.abs(dy)>Math.abs(dx)){closeAlbum();}
  });
  document.addEventListener('keydown',function(e){
    if(!v.classList.contains('open'))return;
    if(e.key==='ArrowRight')eaTurn('next');
    if(e.key==='ArrowLeft')eaTurn('prev');
    if(e.key==='Escape')closeAlbum();
  });
})();
